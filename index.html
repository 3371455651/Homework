<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>901班级作业展示</title>
    <meta name="description" content="这是901班级的作业展示页面，包含各科目的作业内容和分享功能。">
    <meta name="robots" content="noindex">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 苹果系统级字体栈 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #000;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 动态流光背景，用于衬托玻璃质感 */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0f172a;
        }
        
        .ambient-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite alternate ease-in-out;
        }

        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #3b82f6; border-radius: 50%; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #8b5cf6; border-radius: 50%; animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: #06b6d4; border-radius: 50%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 15%) scale(1.2); }
        }

        /* 极致液态玻璃特效 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* 内部内容区玻璃 */
        .glass-inner {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        /* 通知弹窗动画 */
        .notification-enter {
            animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .content {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #ffffff; 
        }
        
        .footer-text {
            color: #f8fafc; 
        }
        
        .subject-title {
            color: #ffffff;
            font-weight: 600;
        }
        
        .share-button {
            color: #60a5fa; 
        }

        .share-button:hover {
            color: #93c5fd; 
        }
       
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col">
    <div class="ambient-bg">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="ambient-blob blob-3"></div>
    </div>

    <div id="notification-container" class="fixed top-4 left-0 right-0 mx-auto w-full max-w-md px-4 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <main class="flex-grow max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 w-full">
        <header class="mb-10 mt-6 sm:mt-10">
            <h1 class="text-4xl sm:text-5xl font-bold text-center tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-300">
                901班级作业展示
            </h1>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            
            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">语文</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('chinese-content', '语文')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="chinese-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">英语</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('english-content', '英语')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="english-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">数学</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('math-content', '数学')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="math-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">地理</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('geography-content', '地理')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="geography-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">物理</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('physics-content', '物理')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="physics-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">历史</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('history-content', '历史')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="history-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">生物</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('biology-content', '生物')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="biology-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">政治</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('politics-content', '政治')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="politics-content">
                    正在同步数据...
                </div>
            </div>

            <div class="glass-panel p-5 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="subject-title text-2xl tracking-wide">化学</h2>
                    <button class="text-sm font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 px-4 py-1.5 rounded-full backdrop-blur-md transition-all duration-200 share-button" onclick="copyToClipboard('chemistry-content', '化学')">分享</button>
                </div>
                <div class="glass-inner p-4 mb-2 content flex-grow overflow-y-auto max-h-64 hide-scrollbar text-sm" id="chemistry-content">

            </div>
        </div>
    </main>

    <footer class="mt-8 pb-8 pt-4 w-full">
        <div class="max-w-2xl mx-auto text-center glass-panel p-6 mx-4 sm:mx-auto">
            <div class="grid grid-cols-2 gap-4 text-sm footer-text">
                <p>作者: <span id="author" class="text-white font-medium">正在加载...</span></p>
                <p>更新: <span id="update-date" class="text-white font-medium">正在加载...</span></p>
                <p>状态: <span id="maintenance-status" class="text-white font-medium">正在加载...</span></p>
                <p>访问: <span id="finicount_views" class="text-white font-medium">0</span></p>
            </div>
        </div>
    </footer>

    <script async src="//finicounter.eu.org/finicounter.js"></script>
    <script>
        // 改为从本地相对路径读取文件
        const contentUrls = {
            chinese: './chinese.txt',
            english: './english.txt',
            math: './math.txt',
            geography: './geography.txt',
            physics: './physics.txt',
            history: './history.txt',
            biology: './biology.txt',
            politics: './politics.txt',
            chemistry: './chemistry.txt',
            footerInfo: './footer.txt',
            notification: './notification.txt'
        };

        // 添加缓存破坏参数
        const cacheBuster = () => `?_t=${Date.now()}`;
        
        // 添加强制刷新按钮的功能
        function addForceRefreshButton() {
            const notificationContainer = document.getElementById('notification-container');
            const refreshBtn = document.createElement('button');
            refreshBtn.className = 'glass-panel p-2 px-4 pointer-events-auto notification-enter shadow-xl border-white/20';
            refreshBtn.innerHTML = `
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="text-sm text-white font-medium">刷新本地数据</span>
                </div>
            `;
            refreshBtn.onclick = forceRefreshAll;
            notificationContainer.appendChild(refreshBtn);
            
            // 5秒后自动移除
            setTimeout(() => {
                if (refreshBtn.parentNode) {
                    refreshBtn.style.opacity = '0';
                    refreshBtn.style.transform = 'translateY(-20px)';
                    refreshBtn.style.transition = 'all 0.4s ease';
                    setTimeout(() => refreshBtn.remove(), 400);
                }
            }, 5000);
        }
        
        function showNotification(title, message, duration = 3000) {
            const notification = document.createElement('div');
            notification.className = 'glass-panel p-4 flex flex-col notification-enter pointer-events-auto shadow-2xl border-white/20';
            notification.innerHTML = `
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-blue-400"></div>
                    <h2 class="font-semibold text-white text-sm tracking-wide">${title}</h2>
                </div>
                <p class="text-gray-200 text-sm ml-4">${message}</p>
            `;

            document.getElementById('notification-container').appendChild(notification);

            if (duration > 0) {
                setTimeout(() => {
                    notification.style.opacity = '0';
                    notification.style.transform = 'translateY(-20px) scale(0.95)';
                    notification.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                    setTimeout(() => notification.remove(), 400);
                }, duration);
            }
        }

        // 修改 fetch 请求添加缓存控制
        async function fetchLocalFile(url) {
            try {
                const response = await fetch(url + cacheBuster(), {
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response;
            } catch (error) {
                console.warn('文件请求失败，请确保文件存在:', url, error);
                return Promise.reject(error);
            }
        }

        // 获取通知
        fetchLocalFile(contentUrls.notification)
            .then(response => response.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    showNotification(data.mode || '系统通知', data.text , data.time);
                } catch (error) {
                    console.error('Error parsing JSON:', error);
                }
            })
            .catch(error => console.error('加载通知失败:', error));

        // 异步加载各科内容
        async function loadContent(subject, url, containerId) {
            try {
                const response = await fetchLocalFile(url);
                const text = await response.text();
                document.getElementById(containerId).textContent = text;
            } catch (error) {
                console.error(`加载 ${subject} 内容失败:`, error);
                document.getElementById(containerId).textContent = `加载 ${subject} 失败，请确保文件存在: ${url}`;
                document.getElementById(containerId).classList.add('text-red-300');
            }
        }

        // 加载页脚信息
        async function loadFooterInfo(url) {
            try {
                const response = await fetchLocalFile(url);
                const data = await response.json();
                document.getElementById('author').textContent = data.author || '未知';
                document.getElementById('update-date').textContent = data.updateDate || '未知';
                document.getElementById('maintenance-status').textContent = data.maintenanceStatus || '未知';
                
                // 检查是否有新版本
                if (data.updateDate) {
                    const lastUpdate = localStorage.getItem('lastFooterUpdate');
                    if (lastUpdate && lastUpdate !== data.updateDate) {
                        showNotification('信息已更新', '页脚信息已刷新，请查看最新内容', 3000);
                    }
                    localStorage.setItem('lastFooterUpdate', data.updateDate);
                }
            } catch (error) {
                console.error('加载页脚信息失败:', error);
                document.getElementById('author').textContent = '加载失败';
                document.getElementById('update-date').textContent = '加载失败';
                document.getElementById('maintenance-status').textContent = '检查文件';
            }
        }

        // 强制刷新所有数据
        async function forceRefreshAll() {
            showNotification('正在刷新', '刷新本地文件数据...', 2000);
            
            // 清空所有内容
            document.getElementById('chinese-content').textContent = '正在刷新...';
            document.getElementById('english-content').textContent = '正在刷新...';
            document.getElementById('math-content').textContent = '正在刷新...';
            document.getElementById('geography-content').textContent = '正在刷新...';
            document.getElementById('physics-content').textContent = '正在刷新...';
            document.getElementById('history-content').textContent = '正在刷新...';
            document.getElementById('biology-content').textContent = '正在刷新...';
            document.getElementById('politics-content').textContent = '正在刷新...';
            document.getElementById('chemistry-content').textContent = '正在刷新...';
            
            document.getElementById('author').textContent = '刷新中...';
            document.getElementById('update-date').textContent = '刷新中...';
            document.getElementById('maintenance-status').textContent = '刷新中...';
            
            // 重新加载所有数据
            await Promise.all([
                loadContent('语文', contentUrls.chinese, 'chinese-content'),
                loadContent('英语', contentUrls.english, 'english-content'),
                loadContent('数学', contentUrls.math, 'math-content'),
                loadContent('地理', contentUrls.geography, 'geography-content'),
                loadContent('物理', contentUrls.physics, 'physics-content'),
                loadContent('历史', contentUrls.history, 'history-content'),
                loadContent('生物', contentUrls.biology, 'biology-content'),
                loadContent('政治', contentUrls.politics, 'politics-content'),
                loadContent('化学', contentUrls.chemistry, 'chemistry-content'),
                loadFooterInfo(contentUrls.footerInfo)
            ]);
            
            showNotification('刷新完成', '所有本地文件已重新加载', 2000);
        }
        
        function copyToClipboard(contentId, subjectName) {
            const content = document.getElementById(contentId).textContent.trim();
            
            if(content.includes('正在同步数据') || content.includes('加载失败') || content.includes('正在刷新')) {
                showNotification('分享失败', '数据未加载完成，请稍后再试', 2000);
                return;
            }

            navigator.clipboard.writeText(`【${subjectName}作业】\n${content}\n\n来自: 901班级作业展示`)
                .then(() => {
                    showNotification('复制成功', `${subjectName}作业已复制到剪贴板，快去分享吧！`, 2500);
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    showNotification('复制失败', '请手动选中内容进行复制', 3000);
                });
        }

        // 页面加载时显示强制刷新按钮
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(addForceRefreshButton, 1000);
        });

        // 批量加载
        loadContent('语文', contentUrls.chinese, 'chinese-content');
        loadContent('英语', contentUrls.english, 'english-content');
        loadContent('数学', contentUrls.math, 'math-content');
        loadContent('地理', contentUrls.geography, 'geography-content');
        loadContent('物理', contentUrls.physics, 'physics-content');
        loadContent('历史', contentUrls.history, 'history-content');
        loadContent('生物', contentUrls.biology, 'biology-content');
        loadContent('政治', contentUrls.politics, 'politics-content');
        loadContent('化学', contentUrls.chemistry, 'chemistry-content');
        loadFooterInfo(contentUrls.footerInfo);
    </script>
</body>
</html>
