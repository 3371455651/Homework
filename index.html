<!doctype html>
<html lang="zh-CN">

<head>

    <meta name="robots" content="noindex">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 苹果系统级字体栈 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #000;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 动态流光背景，用于衬托玻璃质感 */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0f172a;
        }
        
        .ambient-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite alternate ease-in-out;
        }

        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #3b82f6; border-radius: 50%; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #8b5cf6; border-radius: 50%; animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: #06b6d4; border-radius: 50%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 15%) scale(1.2); }
        }

        /* 极致液态玻璃特效 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* 内部内容区玻璃 */
        .glass-inner {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        /* 通知弹窗动画 */
        .notification-enter {
            animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        
        .content {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #ffffff; 
        }

        
        .footer-text {
            color: #f8fafc; 
        }

        
        .subject-title {
            color: #ffffff; /* 纯白色 */
            font-weight: 600;
        }

        
        .share-button {
            color: #60a5fa; 
        }

        .share-button:hover {
            color: #93c5fd; 
        }

       
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <script async src="//finicounter.eu.org/finicounter.js"></script>
    <script>
        const contentUrls = {
            chinese: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/chinese.txt',
            english: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/english.txt',
            math: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/math.txt',
            geography: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/geography.txt',
            physics: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/physics.txt',
            history: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/history.txt',
            biology: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/biology.txt',
            politics: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/politics.txt',
            chemistry: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/chemistry.txt',
            footerInfo: 'https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/footer.txt'
        };

        
        function showNotification(title, message, duration = 3000) {
            const notification = document.createElement('div');
            
            notification.className = 'glass-panel p-4 flex flex-col notification-enter pointer-events-auto shadow-2xl border-white/20';
           
            notification.innerHTML = `
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-blue-400"></div>
                    <h2 class="font-semibold text-white text-sm tracking-wide">${title}</h2>
                </div>
                <p class="text-gray-200 text-sm ml-4">${message}</p>
            `;

            document.getElementById('notification-container').appendChild(notification);

            if (duration > 0) {
                setTimeout(() => {
                    notification.style.opacity = '0';
                    notification.style.transform = 'translateY(-20px) scale(0.95)';
                    notification.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                    setTimeout(() => notification.remove(), 400);
                }, duration);
            }
        }

        // 获取通知
        fetch("https://proxy.092333.xyz/https://raw.githubusercontent.com/3371455651/Homework/main/notification.txt")
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    showNotification(data.mode || '系统通知', data.text , data.time);
                } catch (error) {
                    console.error('Error parsing JSON:', error);
                }
            })
            .catch(error => console.error('Error fetching notification:', error));

        // 异步加载各科内容
        async function loadContent(subject, url, containerId) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const text = await response.text();
                document.getElementById(containerId).textContent = text;
            } catch (error) {
                console.error(`加载 ${subject} 内容失败:`, error);
                document.getElementById(containerId).textContent = `加载 ${subject} 失败，请检查网络。`;
                // 修复：错误提示文字颜色改为亮红色
                document.getElementById(containerId).classList.add('text-red-300');
            }
        }

        // 加载页脚信息
        function loadFooterInfo(url) {
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('author').textContent = data.author || '未知';
                    document.getElementById('update-date').textContent = data.updateDate || '未知';
                    document.getElementById('maintenance-status').textContent = data.maintenanceStatus || '未知';
                })
                .catch(error => {
                    console.error('加载页脚信息失败:', error);
                });
        }

        
        function copyToClipboard(contentId, subjectName) {
            const content = document.getElementById(contentId).textContent.trim();
            
            if(content.includes('正在同步数据') || content.includes('加载失败')) {
                showNotification('分享失败', '数据未加载完成，请稍后再试', 2000);
                return;
            }

            navigator.clipboard.writeText(`【${subjectName}作业】\n${content}\n\n来自: 801班级作业展示`)
                .then(() => {
                    showNotification('复制成功', `${subjectName}作业已复制到剪贴板，快去分享吧！`, 2500);
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    showNotification('复制失败', '请手动选中内容进行复制', 3000);
                });
        }
>
        loadContent('语文', contentUrls.chinese, 'chinese-content');
        loadContent('英语', contentUrls.english, 'english-content');
        loadContent('数学', contentUrls.math, 'math-content');
        loadContent('地理', contentUrls.geography, 'geography-content');
        loadContent('物理', contentUrls.physics, 'physics-content');
        loadContent('历史', contentUrls.history, 'history-content');
        loadContent('生物', contentUrls.biology, 'biology-content');
        loadContent('政治', contentUrls.politics, 'politics-content');
        loadContent('化学', contentUrls.chemistry, 'chemistry-content');
        loadFooterInfo(contentUrls.footerInfo);
    </script>
</body>
